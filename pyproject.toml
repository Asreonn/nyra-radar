[project]
name = "nyra-radar"
version = "0.1.0"
description = "Personal technology intelligence radar and open-source discovery engine for Nyra"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.8",
  "sqlalchemy>=2.0.35",
  "alembic>=1.13",
  "httpx>=0.27",
  "feedparser>=6.0.11",
  "trafilatura>=2.0",
  "beautifulsoup4>=4.12",
  "lxml>=5.3",
  "numpy>=1.26",
  "pillow>=10.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.6",
]

[project.scripts]
radar = "radar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["radar", "radar_client"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: hits real public internet sources (deselected by default)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 110
target-version = "py312"
